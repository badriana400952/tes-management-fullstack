services:
  postgres:
    image: postgres:16-alpine
    container_name: task_management_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: task_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: task_management_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/task_management?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/task_management?schema=public"
      JWT_ACCESS_SECRET: "production-super-secret-jwt-access-key-2026"
      JWT_REFRESH_SECRET: "production-super-secret-jwt-refresh-key-2026"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:3000"
      COOKIE_SECURE: "false"
      REFRESH_COOKIE_NAME: "refreshToken"
      ACCESS_COOKIE_NAME: "accessToken"
      LOG_LEVEL: "http"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.frontend
    container_name: task_management_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
